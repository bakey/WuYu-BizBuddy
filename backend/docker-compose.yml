# 同机部署：复用宿主机的 .env 和本地 bge-m3 模型，用 host 网络直连 127.0.0.1:5440
services:
  bizbuddy-rag:
    build: .
    image: bizbuddy-rag:latest
    container_name: bizbuddy-rag
    # host 网络：容器内 127.0.0.1 == 宿主机，能直接连 5440 的 pg；服务也直接监听宿主 8200
    network_mode: host
    restart: unless-stopped
    # 复用宿主机已配好的 .env（DATABASE_URL/GUFEI_VEC_URL 指向 127.0.0.1:5440）
    env_file: .env
    volumes:
      # 把宿主机模型按"同路径"挂进容器，这样 .env 里的 BGE_M3_MODEL_PATH 不用改
      - /data/models/bge-m3_20250912_235519m:/data/models/bge-m3_20250912_235519m:ro
      # 如果以后开 rerank，把 reranker 模型也按同路径挂进来：
      - /data/models/bge-reranker-v2-m3:/data/models/bge-reranker-v2-m3:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
